name: Scheduled Letterboxd to Trakt Sync

on:
  schedule:
    - cron: '0 */12 * * *'  # Runs automatically every 12 hours
  workflow_dispatch:       # Keeps a manual "Run Workflow" button active for you

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Install uv (Native Package Manager)
      uses: astral-sh/setup-uv@v5
      with:
        enable-cache: true

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Dynamically Create config.yml
      run: |
        cat <<EOF > config.yml
        accounts:
          - letterboxd_username: "nathan1x"  # Changed to your username to bypass her profile privacy wall
            trakt_client_id: "${{ secrets.TRAKT_CLIENT_ID }}"
            trakt_client_secret: "${{ secrets.TRAKT_CLIENT_SECRET }}"
            sync_ratings: false
            sync_watched: false
            sync_watchlist: false
            lists:
              - letterboxd_url: "${{ secrets.LETTERBOXD_LIST_URL }}"
                trakt_list_name: "NO SPOILERS (Until Mal Sees It)"
        EOF

    - name: Execute Sync Engine via uv
      run: |
        export PYTHONUNBUFFERED=1
        
        # Clean lingering temporary execution folders if any exist
        rm -rf engine_exec
        git checkout -- .
        
        # Run the package using the native manager which handles parent package structures cleanly
        timeout 60s uv run letterboxd-trakt || true
