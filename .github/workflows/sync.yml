name: Scheduled Letterboxd to Trakt Sync

on:
  schedule:
    - cron: '0 */12 * * *'  # Runs automatically every 12 hours
  workflow_dispatch:       # Keeps a manual "Run Workflow" button active for you

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: 'pip'

    - name: Install System Dependencies
      run: |
        pip install -r requirements.txt

    - name: Dynamically Create config.yml
      run: |
        cat <<EOF > config.yml
        trakt_client_id: "${{ secrets.TRAKT_CLIENT_ID }}"
        trakt_client_secret: "${{ secrets.TRAKT_CLIENT_SECRET }}"
        letterboxd_username: "dietc0kehead"
        sync_ratings: false
        sync_watched: false
        sync_watchlist: false
        lists:
          - letterboxd_url: "${{ secrets.LETTERBOXD_LIST_URL }}"
            trakt_list_name: "NO SPOILERS (Until Mal Sees It)"
        EOF

    - name: Execute Sync Engine
      run: |
        export PYTHONUNBUFFERED=1
        
        # 1. Rename the local conflicting tracking file to break the circular dependency loop
        mv letterboxd_trakt/trakt.py letterboxd_trakt/local_trakt_wrapper.py
        
        # 2. Rewrite all absolute and relative internal module reference tracks globally
        sed -i 's/from .trakt import/from .local_trakt_wrapper import/g' letterboxd_trakt/main.py
        sed -i 's/import letterboxd_trakt.trakt/import letterboxd_trakt.local_trakt_wrapper/g' letterboxd_trakt/main.py
        
        # 3. Clean runtime compilation caches and execute the patched engine cleanly
        find . -name "*.pyc" -delete
        find . -name "__pycache__" -delete
        
        timeout 60s python letterboxd_trakt/main.py || true
