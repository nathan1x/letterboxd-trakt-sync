name: Scheduled Letterboxd to Trakt Sync

on:
  schedule:
    - cron: '0 */12 * * *'  # Runs automatically every 12 hours
  workflow_dispatch:       # Keeps a manual "Run Workflow" button active for you

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: 'pip'

    - name: Install System Dependencies
      run: |
        pip install -r requirements.txt
        pip install --force-reinstall trakt==2.15.0

    - name: Dynamically Create config.yml
      run: |
        cat <<EOF > config.yml
        trakt_client_id: "${{ secrets.TRAKT_CLIENT_ID }}"
        trakt_client_secret: "${{ secrets.TRAKT_CLIENT_SECRET }}"
        letterboxd_username: "dietc0kehead"
        sync_ratings: false
        sync_watched: false
        sync_watchlist: false
        lists:
          - letterboxd_url: "${{ secrets.LETTERBOXD_LIST_URL }}"
            trakt_list_name: "NO SPOILERS (Until Mal Sees It)"
        EOF

    - name: Execute Sync Engine
      run: |
        export PYTHONUNBUFFERED=1
        
        # Remove any lingering python compilation caches that might be locking the module conflict
        find . -name "*.pyc" -delete
        find . -name "__pycache__" -delete
        
        # Force Python to execute the folder as a package/module (-m), fixing the local namespace trap
        timeout 60s python -m letterboxd_trakt.main || true
