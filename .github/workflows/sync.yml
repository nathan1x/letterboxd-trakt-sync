name: Scheduled Letterboxd to Trakt Sync

on:
  schedule:
    - cron: '0 */12 * * *'  # Runs automatically every 12 hours
  workflow_dispatch:       # Keeps a manual "Run Workflow" button active for you

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: 'pip'

    - name: Install System Dependencies
      run: |
        pip install -r requirements.txt

    - name: Dynamically Create config.yml
      run: |
        cat <<EOF > config.yml
        trakt_client_id: "${{ secrets.TRAKT_CLIENT_ID }}"
        trakt_client_secret: "${{ secrets.TRAKT_CLIENT_SECRET }}"
        letterboxd_username: "dietc0kehead"
        sync_ratings: false
        sync_watched: false
        sync_watchlist: false
        lists:
          - letterboxd_url: "${{ secrets.LETTERBOXD_LIST_URL }}"
            trakt_list_name: "NO SPOILERS (Until Mal Sees It)"
        EOF

    - name: Execute Sync Engine
      run: |
        export PYTHONUNBUFFERED=1
        
        # 1. Temporarily move the internal colliding directory out of Python's immediate search tree
        mv letterboxd_trakt engine_exec
        
        # 2. Fix the file internal path references so they look globally inside the execution scope
        sed -i 's/from letterboxd_trakt/from engine_exec/g' engine_exec/main.py
        sed -i 's/from .trakt/from engine_exec.trakt/g' engine_exec/main.py
        
        # 3. Clean up the system caching blocks and kick off execution cleanly
        find . -name "*.pyc" -delete
        find . -name "__pycache__" -delete
        
        timeout 60s python engine_exec/main.py || true
